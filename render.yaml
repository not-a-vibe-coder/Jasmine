# Render Blueprint for Jasmine.
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked `sync: false`
# are asked for once at creation (or paste .env via "Add from .env").
services:
  - type: web
    name: jasmine
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free instances sleep after 15 min idle; a Telegram webhook wakes them, but spontaneous
    # group messages pause while asleep. Use "starter" to keep Jasmine always on.
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Optional extras (add in the dashboard): OWNER_IDS, POLLINATIONS_API_KEY, GIPHY_API_KEY,
      # HF_TOKEN, VOICE_NAME, MISTRAL_API_KEY, MOLTBOOK_API_KEY, DEFAULT_TIMEZONE (default Africa/Lagos), REDIS_URL.
      # Calls: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER (phone) and
      # TG_API_ID, TG_API_HASH, TG_CALLER_SESSION (Telegram calls; see scripts/tg-caller-login.py).
      # WEBHOOK_URL and SANDBOX_CALLBACK_URL are derived from RENDER_EXTERNAL_URL automatically.
      - key: OWNERS_USERNAME
        value: "@jackdotsol_"
      - key: TELEGRAM_BOT_USERNAME
        value: "@JasmineMemBot"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MEMWAL_SERVER_URL
        value: https://relayer.memory.walrus.xyz
      - key: GITHUB_USERNAME
        value: thejasminebot
      - key: SANDBOX_REPO
        value: thejasminebot/sand-box
      - key: SANDBOX_PRIVATE_REPO
        value: thejasminebot/sand-box
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: MEMWAL_DELEGATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: SVM_WALLET_PRIVATE_KEY
        sync: false
      - key: EVM_WALLET_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jasmine-db
          property: connectionString

databases:
  # Free Render Postgres keeps short-term chat history, summaries and profiles across
  # restarts (long-term memory lives on Walrus). Free databases expire 30 days after
  # creation; upgrade the plan or point DATABASE_URL elsewhere to keep it longer.
  - name: jasmine-db
    plan: free
    region: frankfurt
    databaseName: jasmine
    user: jasmine
